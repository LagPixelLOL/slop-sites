<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark" />
  <title>Terminal Image Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Applied to thousands of JS-generated <span>s; kept in raw CSS so each
       span doesn't have to carry a long list of Tailwind utility classes.
       6x12 (ratio 1:2) was chosen because a single scale snap can make
       each cell land on whole device pixels on both axes simultaneously
       (12 = 2 * 6), which eliminates anti-aliasing seams between rows
       and columns. The 1:2 aspect also matches the 4x8 source block
       aspect so scaled images keep correct proportions. */
    #preview .c {
      display: inline-block;
      width: 6px;
      height: 12px;
      line-height: 12px;
      overflow: hidden;
      vertical-align: top;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 sm:p-6">
    <header class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-zinc-100">
        Terminal Image Viewer
      </h1>
      <p class="text-zinc-400 mt-1 text-sm">
        Convert images into ANSI block-character art, previewed in-browser.
        <span class="text-zinc-500">
          Paste (Ctrl/Cmd+V) or drag &amp; drop an image anywhere.
        </span>
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-6">
      <aside class="bg-zinc-900 border border-zinc-800 rounded-lg p-5 space-y-5 h-fit">
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Image</label>
          <input type="file" id="fileInput" accept="image/*"
            class="block w-full text-sm text-zinc-400
                   file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0
                   file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700
                   file:cursor-pointer cursor-pointer">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">
              Width (chars)
            </label>
            <input type="number" id="width" value="100" min="1" max="1000"
              class="w-full bg-zinc-800 border border-zinc-700 rounded
                     px-2 py-1.5 text-sm text-zinc-200
                     focus:outline-none focus:border-zinc-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">
              Height (0 = auto)
            </label>
            <input type="number" id="height" value="0" min="0" max="1000"
              class="w-full bg-zinc-800 border border-zinc-700 rounded
                     px-2 py-1.5 text-sm text-zinc-200
                     focus:outline-none focus:border-zinc-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">
            Transparent BG Color
          </label>
          <input type="color" id="bgColor" value="#ffffff"
            class="w-full h-10 bg-zinc-800 border border-zinc-700
                   rounded cursor-pointer">
        </div>

        <div class="space-y-2 pt-2 border-t border-zinc-800">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="mode256" class="accent-zinc-500 w-4 h-4">
            <span class="text-sm text-zinc-300">256-color mode</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="noopt" class="accent-zinc-500 w-4 h-4">
            <span class="text-sm text-zinc-300">No block-char optimization</span>
          </label>
        </div>

        <div class="pt-2 border-t border-zinc-800 space-y-2">
          <button id="copyBtn"
            class="w-full bg-zinc-800 hover:bg-zinc-700
                   disabled:opacity-50 disabled:cursor-not-allowed
                   text-zinc-100 rounded px-3 py-2 text-sm font-medium
                   transition">
            Copy ANSI to clipboard
          </button>
          <button id="downloadBtn"
            class="w-full bg-zinc-800 hover:bg-zinc-700
                   disabled:opacity-50 disabled:cursor-not-allowed
                   text-zinc-100 rounded px-3 py-2 text-sm font-medium
                   transition">
            Download .ans file
          </button>
        </div>
      </aside>

      <main class="space-y-4 min-w-0">
        <section class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden">
          <div class="px-4 py-2 border-b border-zinc-800 flex items-center justify-between gap-3">
            <h2 class="text-sm font-medium text-zinc-300">ANSI Preview</h2>
            <span id="statsDisplay" class="text-xs text-zinc-500">
              Load or paste an image to begin
            </span>
          </div>
          <div id="previewViewport"
            class="bg-black flex items-center justify-center
                   h-[75dvh] min-h-[300px] overflow-hidden">
            <div id="previewStage" class="inline-block">
              <div id="previewInner"
                class="origin-top-left will-change-transform backface-hidden">
                <pre id="preview"
                  class="font-mono text-[12px] leading-none whitespace-pre m-0"></pre>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    "use strict";

    // ---------- Constants ----------
    const FLAG_FG       = 1;
    const FLAG_BG       = 2;
    const FLAG_MODE_256 = 4;
    const FLAG_NOOPT    = 16;

    // Must match the width/height set on #preview .c in the stylesheet.
    // 12 = 2 * 6 so a single scale snap makes both cell width and cell
    // height integer device pixels.
    const PREVIEW_CELL_W = 6;
    const PREVIEW_CELL_H = 12;

    const WIDTH_MIN  = 1;
    const WIDTH_MAX  = 1000;
    const HEIGHT_MIN = 0; // 0 = auto
    const HEIGHT_MAX = 1000;

    const COLOR_STEPS = [0, 0x5f, 0x87, 0xaf, 0xd7, 0xff];
    const GRAYSCALE_STEPS = [
      0x08, 0x12, 0x1c, 0x26, 0x30, 0x3a, 0x44, 0x4e,
      0x58, 0x62, 0x6c, 0x76, 0x80, 0x8a, 0x94, 0x9e,
      0xa8, 0xb2, 0xbc, 0xc6, 0xd0, 0xda, 0xe4, 0xee
    ];

    const BITMAPS = [
      [0x00000000, 0x00a0],
      [0x0000000f, 0x2581],
      [0x000000ff, 0x2582],
      [0x00000fff, 0x2583],
      [0x0000ffff, 0x2584],
      [0x000fffff, 0x2585],
      [0x00ffffff, 0x2586],
      [0x0fffffff, 0x2587],
      [0xeeeeeeee, 0x258a],
      [0xcccccccc, 0x258c],
      [0x88888888, 0x258e],
      [0x0000cccc, 0x2596],
      [0x00003333, 0x2597],
      [0xcccc0000, 0x2598],
      [0xcccc3333, 0x259a],
      [0x33330000, 0x259d],
      [0x000ff000, 0x2501],
      [0x66666666, 0x2503],
      [0x00077666, 0x250f],
      [0x000ee666, 0x2513],
      [0x66677000, 0x2517],
      [0x666ee000, 0x251b],
      [0x66677666, 0x2523],
      [0x666ee666, 0x252b],
      [0x000ff666, 0x2533],
      [0x666ff000, 0x253b],
      [0x666ff666, 0x254b],
      [0x000cc000, 0x2578],
      [0x00066000, 0x2579],
      [0x00033000, 0x257a],
      [0x00066000, 0x257b],
      [0x06600660, 0x254f],
      [0x000f0000, 0x2500],
      [0x0000f000, 0x2500],
      [0x44444444, 0x2502],
      [0x22222222, 0x2502],
      [0x000e0000, 0x2574],
      [0x0000e000, 0x2574],
      [0x44440000, 0x2575],
      [0x22220000, 0x2575],
      [0x00030000, 0x2576],
      [0x00003000, 0x2576],
      [0x00004444, 0x2577],
      [0x00002222, 0x2577],
      [0x44444444, 0x23a2],
      [0x22222222, 0x23a5],
      [0x0f000000, 0x23ba],
      [0x00f00000, 0x23bb],
      [0x00000f00, 0x23bc],
      [0x000000f0, 0x23bd],
      [0x00066000, 0x25aa],
      [0x000137f0, 0x25e2],
      [0x0008cef0, 0x25e3],
      [0x000fec80, 0x25e4],
      [0x000f7310, 0x25e5]
    ];

    function buildStepLookup(steps) {
      const table = new Uint8Array(256);
      for (let v = 0; v < 256; v++) {
        let best = 0;
        let bestDiff = Math.abs(steps[0] - v);
        for (let i = 1; i < steps.length; i++) {
          const d = Math.abs(steps[i] - v);
          if (d < bestDiff) {
            bestDiff = d;
            best = i;
          }
        }
        table[v] = best;
      }
      return table;
    }

    const COLOR_STEP_LOOKUP = buildStepLookup(COLOR_STEPS);
    const GRAY_STEP_LOOKUP  = buildStepLookup(GRAYSCALE_STEPS);

    // ---------- Helpers ----------
    function popcount(n) {
      n = n >>> 0;
      n = n - ((n >>> 1) & 0x55555555);
      n = (n & 0x33333333) + ((n >>> 2) & 0x33333333);
      n = (n + (n >>> 4)) & 0x0f0f0f0f;
      return Math.imul(n, 0x01010101) >>> 24;
    }

    function clampByte(v) {
      return v < 0 ? 0 : v > 255 ? 255 : v | 0;
    }

    function clampInt(v, lo, hi) {
      v = v | 0;
      if (v < lo) return lo;
      if (v > hi) return hi;
      return v;
    }

    function quantize256(r, g, b) {
      r = clampByte(r);
      g = clampByte(g);
      b = clampByte(b);

      const ri = COLOR_STEP_LOOKUP[r];
      const gi = COLOR_STEP_LOOKUP[g];
      const bi = COLOR_STEP_LOOKUP[b];
      const rq = COLOR_STEPS[ri];
      const gq = COLOR_STEPS[gi];
      const bq = COLOR_STEPS[bi];

      let gray = (r * 0.2989 + g * 0.5870 + b * 0.1140 + 0.5) | 0;
      if (gray > 255) gray = 255;
      const gri = GRAY_STEP_LOOKUP[gray];
      const grq = GRAYSCALE_STEPS[gri];

      const cd = 0.30 * (rq  - r) * (rq  - r)
               + 0.59 * (gq  - g) * (gq  - g)
               + 0.11 * (bq  - b) * (bq  - b);
      const gd = 0.30 * (grq - r) * (grq - r)
               + 0.59 * (grq - g) * (grq - g)
               + 0.11 * (grq - b) * (grq - b);

      if (cd < gd) return [rq, gq, bq];
      return [grq, grq, grq];
    }

    const termColorCache = new Map();
    function termColor(flags, r, g, b) {
      r = clampByte(r);
      g = clampByte(g);
      b = clampByte(b);
      const key = ((flags & 0xff) * 0x1000000) + (r << 16) + (g << 8) + b;
      const cached = termColorCache.get(key);
      if (cached !== undefined) return cached;

      const isBg = (flags & FLAG_BG) !== 0;
      let result;
      if ((flags & FLAG_MODE_256) === 0) {
        result = (isBg ? "\x1b[48;2;" : "\x1b[38;2;") +
                 r + ";" + g + ";" + b + "m";
      } else {
        const ri = COLOR_STEP_LOOKUP[r];
        const gi = COLOR_STEP_LOOKUP[g];
        const bi = COLOR_STEP_LOOKUP[b];
        const rq = COLOR_STEPS[ri];
        const gq = COLOR_STEPS[gi];
        const bq = COLOR_STEPS[bi];

        let gray = (r * 0.2989 + g * 0.5870 + b * 0.1140 + 0.5) | 0;
        if (gray > 255) gray = 255;
        const gri = GRAY_STEP_LOOKUP[gray];
        const grq = GRAYSCALE_STEPS[gri];

        const cd = 0.30 * (rq  - r) * (rq  - r)
                 + 0.59 * (gq  - g) * (gq  - g)
                 + 0.11 * (bq  - b) * (bq  - b);
        const gd = 0.30 * (grq - r) * (grq - r)
                 + 0.59 * (grq - g) * (grq - g)
                 + 0.11 * (grq - b) * (grq - b);

        const idx = cd < gd ? (16 + 36 * ri + 6 * gi + bi) : (232 + gri);
        result = (isBg ? "\x1b[48;5;" : "\x1b[38;5;") + idx + "m";
      }
      termColorCache.set(key, result);
      return result;
    }

    // ---------- Character selection ----------
    function createCharData(block, codepoint, pattern) {
      let fR = 0, fG = 0, fB = 0, fN = 0;
      let bR = 0, bG = 0, bB = 0, bN = 0;
      for (let i = 0; i < 32; i++) {
        const bit = (pattern >>> (31 - i)) & 1;
        const p = block[i];
        if (bit) {
          fR += p[0]; fG += p[1]; fB += p[2]; fN++;
        } else {
          bR += p[0]; bG += p[1]; bB += p[2]; bN++;
        }
      }
      const fg = fN ? [(fR / fN) | 0, (fG / fN) | 0, (fB / fN) | 0] : [0, 0, 0];
      const bg = bN ? [(bR / bN) | 0, (bG / bN) | 0, (bB / bN) | 0] : [0, 0, 0];
      return { fg: fg, bg: bg, codepoint: codepoint };
    }

    function findCharData(block) {
      const counts = new Map();
      for (let i = 0; i < 32; i++) {
        const p = block[i];
        const k = (p[0] << 16) | (p[1] << 8) | p[2];
        counts.set(k, (counts.get(k) || 0) + 1);
      }
      const items = Array.from(counts.entries())
        .sort(function (a, b) { return b[1] - a[1]; });

      let c1 = items[0][0];
      const cnt1 = items[0][1];
      let c2;
      let total;
      if (items.length > 1) {
        c2 = items[1][0];
        total = cnt1 + items[1][1];
      } else {
        c2 = c1;
        total = cnt1;
      }

      const direct = total > 16;
      let bits = 0;

      if (direct) {
        const c1r = (c1 >> 16) & 255;
        const c1g = (c1 >>  8) & 255;
        const c1b =  c1        & 255;
        const c2r = (c2 >> 16) & 255;
        const c2g = (c2 >>  8) & 255;
        const c2b =  c2        & 255;
        for (let i = 0; i < 32; i++) {
          const p = block[i];
          const dr1 = p[0] - c1r, dg1 = p[1] - c1g, db1 = p[2] - c1b;
          const dr2 = p[0] - c2r, dg2 = p[1] - c2g, db2 = p[2] - c2b;
          const d1 = dr1 * dr1 + dg1 * dg1 + db1 * db1;
          const d2 = dr2 * dr2 + dg2 * dg2 + db2 * db2;
          bits = (bits << 1) | (d1 > d2 ? 1 : 0);
        }
      } else {
        let minR = 255, minG = 255, minB = 255;
        let maxR = 0,   maxG = 0,   maxB = 0;
        for (let i = 0; i < 32; i++) {
          const p = block[i];
          if (p[0] < minR) minR = p[0];
          if (p[0] > maxR) maxR = p[0];
          if (p[1] < minG) minG = p[1];
          if (p[1] > maxG) maxG = p[1];
          if (p[2] < minB) minB = p[2];
          if (p[2] > maxB) maxB = p[2];
        }
        const rangeR = maxR - minR;
        const rangeG = maxG - minG;
        const rangeB = maxB - minB;

        let splitIdx;
        let splitVal;
        if (rangeR >= rangeG && rangeR >= rangeB) {
          splitIdx = 0;
          splitVal = minR + (rangeR >> 1);
        } else if (rangeG >= rangeB) {
          splitIdx = 1;
          splitVal = minG + (rangeG >> 1);
        } else {
          splitIdx = 2;
          splitVal = minB + (rangeB >> 1);
        }
        for (let i = 0; i < 32; i++) {
          bits = (bits << 1) | (block[i][splitIdx] > splitVal ? 1 : 0);
        }
      }
      bits = bits >>> 0;

      let bestDiff    = 8;
      let bestPattern = 0x0000ffff;
      let codepoint   = 0x2584;
      let inverted    = false;

      for (let i = 0; i < BITMAPS.length; i++) {
        const pat = BITMAPS[i][0];
        const cp  = BITMAPS[i][1];
        const diff = popcount((pat ^ bits) >>> 0);
        if (diff < bestDiff) {
          bestPattern = pat;
          codepoint   = cp;
          bestDiff    = diff;
          inverted    = false;
        }
        const invDiff = 32 - diff;
        if (invDiff < bestDiff) {
          bestPattern = pat;
          codepoint   = cp;
          bestDiff    = invDiff;
          inverted    = true;
        }
      }

      if (direct) {
        let fgKey = c2;
        let bgKey = c1;
        if (inverted) {
          fgKey = c1;
          bgKey = c2;
        }
        return {
          fg: [(fgKey >> 16) & 255, (fgKey >> 8) & 255, fgKey & 255],
          bg: [(bgKey >> 16) & 255, (bgKey >> 8) & 255, bgKey & 255],
          codepoint: codepoint
        };
      }
      return createCharData(block, codepoint, bestPattern);
    }

    // ---------- Renderer ----------
    function getBlock(data, w, x, y) {
      const block = new Array(32);
      let idx = 0;
      for (let dy = 0; dy < 8; dy++) {
        let row = ((y + dy) * w + x) * 4;
        for (let dx = 0; dx < 4; dx++) {
          block[idx++] = [data[row], data[row + 1], data[row + 2]];
          row += 4;
        }
      }
      return block;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, function (c) {
        return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
      });
    }

    function renderImage(data, w, h, flags) {
      const htmlParts = [];
      const ansiParts = [];
      const noopt   = (flags & FLAG_NOOPT)    !== 0;
      const mode256 = (flags & FLAG_MODE_256) !== 0;
      const fgFlags = flags | FLAG_FG;
      const bgFlags = flags | FLAG_BG;

      for (let y = 0; y + 8 <= h; y += 8) {
        let lastFg = -1;
        let lastBg = -1;
        for (let x = 0; x + 4 <= w; x += 4) {
          const block = getBlock(data, w, x, y);
          const cd = noopt
            ? createCharData(block, 0x2584, 0x0000ffff)
            : findCharData(block);

          const rawFg = cd.fg;
          const rawBg = cd.bg;

          const dispFg = mode256
            ? quantize256(rawFg[0], rawFg[1], rawFg[2])
            : rawFg;
          const dispBg = mode256
            ? quantize256(rawBg[0], rawBg[1], rawBg[2])
            : rawBg;

          const ch = String.fromCodePoint(cd.codepoint);

          htmlParts.push(
            '<span class="c" style="color:rgb(' +
            dispFg[0] + ',' + dispFg[1] + ',' + dispFg[2] +
            ');background:rgb(' +
            dispBg[0] + ',' + dispBg[1] + ',' + dispBg[2] +
            ')">' + escapeHtml(ch) + '</span>'
          );

          const fgKey = (rawFg[0] << 16) | (rawFg[1] << 8) | rawFg[2];
          const bgKey = (rawBg[0] << 16) | (rawBg[1] << 8) | rawBg[2];
          if (bgKey !== lastBg) {
            ansiParts.push(termColor(bgFlags, rawBg[0], rawBg[1], rawBg[2]));
            lastBg = bgKey;
          }
          if (fgKey !== lastFg) {
            ansiParts.push(termColor(fgFlags, rawFg[0], rawFg[1], rawFg[2]));
            lastFg = fgKey;
          }
          ansiParts.push(ch);
        }
        htmlParts.push("\n");
        ansiParts.push("\x1b[0m\n");
      }
      return { html: htmlParts.join(""), ansi: ansiParts.join("") };
    }

    // ---------- UI wiring ----------
    let currentImage = null;
    let currentAnsi  = "";
    let scheduled    = false;

    function parseHexColor(hex) {
      const h = hex.replace("#", "");
      return [
        parseInt(h.slice(0, 2), 16),
        parseInt(h.slice(2, 4), 16),
        parseInt(h.slice(4, 6), 16)
      ];
    }

    // Fit the preview into its viewport via a single CSS scale transform.
    //
    // Algorithm:
    //   1. Compute the ideal fit scale s* = min(availW/cw, availH/ch).
    //   2. Snap it so one cell spans an integer number of device pixels
    //      (eliminates the anti-aliasing seams between cells at fractional
    //      device-pixel boundaries).
    //   3. Prefer rounding (tighter fit), but if rounding up would make
    //      the content overflow either viewport axis, fall back to floor.
    //      This matters a lot at high column counts: the per-cell snap
    //      error compounds linearly, so rounding up ~0.5 device px per
    //      cell across 1000 cells can overshoot by hundreds of pixels
    //      and visibly crop the image. Floor is guaranteed to fit.
    function fitPreview() {
      const viewport = document.getElementById("previewViewport");
      const stage    = document.getElementById("previewStage");
      const inner    = document.getElementById("previewInner");
      if (!viewport || !stage || !inner) return;

      inner.style.transform = "none";
      stage.style.width  = "auto";
      stage.style.height = "auto";

      const cw = inner.offsetWidth;
      const ch = inner.offsetHeight;
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      if (!cw || !ch || !vw || !vh) return;

      const pad = 8;
      const availW = Math.max(1, vw - pad * 2);
      const availH = Math.max(1, vh - pad * 2);

      const idealScale = Math.min(availW / cw, availH / ch);
      const dpr = window.devicePixelRatio || 1;
      const raw = idealScale * PREVIEW_CELL_W * dpr;

      // Try round first for a tight fit.
      let cellWDevice = Math.max(1, Math.round(raw));
      let scale = cellWDevice / (PREVIEW_CELL_W * dpr);

      // If rounding overshot the viewport (happens whenever raw's
      // fractional part >= 0.5 and the compounded per-cell error across
      // cw/6 cells pushes us over), fall back to floor, which always
      // satisfies scale <= idealScale.
      if (cw * scale > availW + 0.5 || ch * scale > availH + 0.5) {
        cellWDevice = Math.max(1, Math.floor(raw));
        scale = cellWDevice / (PREVIEW_CELL_W * dpr);
      }

      const sw = Math.round(cw * scale);
      const sh = Math.round(ch * scale);

      inner.style.transform = "translateZ(0) scale(" + scale + ")";
      stage.style.width  = sw + "px";
      stage.style.height = sh + "px";
    }

    function readSizeInputs() {
      const wEl = document.getElementById("width");
      const hEl = document.getElementById("height");

      let widthChars = parseInt(wEl.value, 10);
      if (!Number.isFinite(widthChars)) widthChars = WIDTH_MIN;
      widthChars = clampInt(widthChars, WIDTH_MIN, WIDTH_MAX);

      let heightChars = parseInt(hEl.value, 10);
      if (!Number.isFinite(heightChars)) heightChars = HEIGHT_MIN;
      heightChars = clampInt(heightChars, HEIGHT_MIN, HEIGHT_MAX);

      if (document.activeElement !== wEl && String(widthChars)  !== wEl.value) wEl.value = widthChars;
      if (document.activeElement !== hEl && String(heightChars) !== hEl.value) hEl.value = heightChars;

      return { widthChars: widthChars, heightChars: heightChars };
    }

    function renderNow() {
      if (!currentImage) return;

      const sizes    = readSizeInputs();
      const mode256  = document.getElementById("mode256").checked;
      const noopt    = document.getElementById("noopt").checked;
      const bgColor  = document.getElementById("bgColor").value;

      const maxW = sizes.widthChars  * 4;
      const maxH = sizes.heightChars * 8;

      const img = currentImage;
      const w = img.naturalWidth  || img.width;
      const h = img.naturalHeight || img.height;
      if (!w || !h) return;

      // Width is a target; height follows aspect unless a non-zero
      // height cap forces a tighter scale.
      let scale = maxW / w;
      if (sizes.heightChars > 0) {
        scale = Math.min(scale, maxH / h);
      }

      let newW = Math.max(4, Math.round(w * scale));
      let newH = Math.max(8, Math.round(h * scale));
      newW = Math.max(4, Math.floor(newW / 4) * 4);
      newH = Math.max(8, Math.floor(newH / 8) * 8);

      const canvas = document.createElement("canvas");
      canvas.width  = newW;
      canvas.height = newH;
      const ctx = canvas.getContext("2d");
      const bg = parseHexColor(bgColor);
      ctx.fillStyle = "rgb(" + bg[0] + "," + bg[1] + "," + bg[2] + ")";
      ctx.fillRect(0, 0, newW, newH);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, newW, newH);

      let imageData;
      try {
        imageData = ctx.getImageData(0, 0, newW, newH);
      } catch (e) {
        document.getElementById("preview").textContent =
          "Error reading pixels: " + e.message;
        return;
      }

      const flags = (mode256 ? FLAG_MODE_256 : 0) | (noopt ? FLAG_NOOPT : 0);
      const t0 = performance.now();
      const result = renderImage(imageData.data, newW, newH, flags);
      const dt = Math.round(performance.now() - t0);

      document.getElementById("preview").innerHTML = result.html;
      currentAnsi = result.ansi;

      document.getElementById("statsDisplay").textContent =
        (newW / 4) + " x " + (newH / 8) + " chars - " +
        result.ansi.length + " bytes - " + dt + " ms";

      document.getElementById("copyBtn").disabled     = false;
      document.getElementById("downloadBtn").disabled = false;

      requestAnimationFrame(fitPreview);
    }

    function scheduleRender() {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        try {
          renderNow();
        } catch (e) {
          document.getElementById("preview").textContent = "Error: " + e.message;
        }
      });
    }

    // ---------- Image loading ----------
    function loadImageFromBlob(blob) {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () {
        currentImage = img;
        scheduleRender();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      };
      img.onerror = function () {
        document.getElementById("preview").textContent = "Failed to load image.";
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    // ---------- Event listeners ----------
    document.getElementById("fileInput").addEventListener("change", function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      loadImageFromBlob(file);
    });

    ["width", "height", "bgColor"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", scheduleRender);
    });
    ["mode256", "noopt"].forEach(function (id) {
      document.getElementById(id).addEventListener("change", scheduleRender);
    });

    ["width", "height"].forEach(function (id) {
      document.getElementById(id).addEventListener("blur", function () {
        readSizeInputs();
      });
    });

    document.getElementById("copyBtn").addEventListener("click", async function () {
      if (!currentAnsi) return;
      const btn = this;
      const orig = btn.textContent;
      try {
        await navigator.clipboard.writeText(currentAnsi);
        btn.textContent = "Copied!";
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = currentAnsi;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand("copy");
          btn.textContent = "Copied!";
        } catch (_) {
          btn.textContent = "Copy failed";
        }
        ta.remove();
      }
      setTimeout(function () { btn.textContent = orig; }, 1500);
    });

    document.getElementById("downloadBtn").addEventListener("click", function () {
      if (!currentAnsi) return;
      const blob = new Blob([currentAnsi], { type: "text/plain;charset=utf-8" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = "image.ans";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    // Paste anywhere -> load image.
    window.addEventListener("paste", function (e) {
      const cd = e.clipboardData || window.clipboardData;
      if (!cd) return;

      if (cd.items && cd.items.length) {
        for (let i = 0; i < cd.items.length; i++) {
          const item = cd.items[i];
          if (item.kind === "file" && item.type && item.type.indexOf("image/") === 0) {
            const blob = item.getAsFile();
            if (blob) {
              e.preventDefault();
              loadImageFromBlob(blob);
              return;
            }
          }
        }
      }

      if (cd.files && cd.files.length) {
        for (let i = 0; i < cd.files.length; i++) {
          const f = cd.files[i];
          if (f.type && f.type.indexOf("image/") === 0) {
            e.preventDefault();
            loadImageFromBlob(f);
            return;
          }
        }
      }
    });

    // Drag & drop anywhere.
    window.addEventListener("dragover", function (e) {
      if (
        e.dataTransfer && e.dataTransfer.types &&
        Array.prototype.indexOf.call(e.dataTransfer.types, "Files") !== -1
      ) {
        e.preventDefault();
      }
    });
    window.addEventListener("drop", function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      const f = e.dataTransfer.files[0];
      if (f.type && f.type.indexOf("image/") === 0) {
        e.preventDefault();
        loadImageFromBlob(f);
      }
    });

    // Keep the preview fitted on viewport size changes.
    const viewportEl = document.getElementById("previewViewport");
    if (window.ResizeObserver && viewportEl) {
      new ResizeObserver(fitPreview).observe(viewportEl);
    }
    window.addEventListener("resize", fitPreview);

    document.getElementById("copyBtn").disabled     = true;
    document.getElementById("downloadBtn").disabled = true;
  </script>
</body>
</html>
