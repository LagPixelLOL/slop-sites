<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perlin WebGPU</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body {
      background-color: #000;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background-image 200ms ease, background-color 200ms ease;
    }
    body.bg-image {
      background-color: #000;
      background-image: url("https://images.unsplash.com/photo-1506905925346-21bda4d32df4");
    }

    canvas { width: 100dvw; height: 100dvh; display: block; background: transparent; }

    #hud {
      position: fixed; left: 16px; top: 16px;
      font: 1rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #ddd; background: rgba(0,0,0,0.55);
      padding: 10px 10px; border-radius: 8px;
      max-width: 720px;
      backdrop-filter: blur(6px);
    }

    .hud-btn {
      display: block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #ddd;
      cursor: pointer;
      user-select: none;
    }
    .hud-btn:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>Perlin WebGPU</div>
    <button id="toggleMode" class="hud-btn">Switch mode</button>
    <button id="toggleBg" class="hud-btn">Background: Black</button>
    <div id="status" style="margin-top:8px;color:#bbb;font-size:0.9rem;line-height:1.25;"></div>
  </div>

  <script type="module">
    let canvas = document.getElementById("c");
    const statusEl = document.getElementById("status");
    const toggleModeBtn = document.getElementById("toggleMode");
    const toggleBgBtn = document.getElementById("toggleBg");

    let currentMode = null;
    let rafId = 0;
    let activeConfigure = null;
    let bgMode = "black";

    const modes = ["webgpu", "webgl"];

    let caContrast = 1;
    let caSamples = 32;
    let caSpread = 0.025;
    let caCenterX = 0.5;
    let caCenterY = 0.5;

    function getCAParams() {
      let samples = Math.round(caSamples);
      samples = Math.max(2, samples);
      if (samples % 2 !== 0) samples = samples + 1;
      return {
        contrast: caContrast,
        samples,
        spread: caSpread,
        centerX: caCenterX,
        centerY: caCenterY,
      };
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function replaceCanvas() {
      const newCanvas = document.createElement("canvas");
      newCanvas.id = "c";
      canvas.replaceWith(newCanvas);
      canvas = newCanvas;
      return canvas;
    }

    function stopActive() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      activeConfigure = null;
    }

    function nextMode(current) {
      const idx = modes.indexOf(current);
      return modes[(idx + 1) % modes.length];
    }

    function modeLabel(m) {
      if (m === "webgpu") return "WebGPU";
      if (m === "webgl") return "WebGL";
      return m;
    }

    function updateModeButtonLabel() {
      const next = nextMode(currentMode);
      toggleModeBtn.textContent = `Switch to ${modeLabel(next)}`;
    }

    function updateBgButtonLabel() {
      toggleBgBtn.textContent = bgMode === "image" ? "Background: Image" : "Background: Black";
    }

    function applyBackground() {
      if (bgMode === "image") document.body.classList.add("bg-image");
      else document.body.classList.remove("bg-image");
      updateBgButtonLabel();
      updateStatusLine();
    }

    function updateStatusLine(extra = "") {
      const modeText = currentMode ? `Mode: ${modeLabel(currentMode)}` : "Mode: (starting...)";
      const bgText = `Background: ${bgMode === "image" ? "Image" : "Black"}`;
      setStatus([modeText, bgText, extra].filter(Boolean).join(" - "));
    }

    window.addEventListener("resize", () => activeConfigure && activeConfigure(), { passive: true });

    async function start(mode) {
      stopActive();
      replaceCanvas();

      if (mode === "webgpu") {
        if (!navigator.gpu) {
          return await start("webgl");
        }
        try {
          await startWebGPU();
          currentMode = "webgpu";
          updateModeButtonLabel();
          updateStatusLine();
        } catch (e) {
          console.warn("WebGPU init failed:", e);
          return await start("webgl");
        }
      } else if (mode === "webgl") {
        try {
          await startWebGL();
          currentMode = "webgl";
          updateModeButtonLabel();
          updateStatusLine();
        } catch (e) {
          console.warn("WebGL init failed:", e);
          updateStatusLine("No supported rendering backend found.");
        }
      }
    }

    toggleModeBtn.addEventListener("click", async () => {
      const next = nextMode(currentMode);
      await start(next);
    });

    toggleBgBtn.addEventListener("click", () => {
      bgMode = (bgMode === "black") ? "image" : "black";
      applyBackground();
    });

    async function startWebGPU() {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error("No GPU adapter found");

      const device = await adapter.requestDevice();

      const context = canvas.getContext("webgpu");
      if (!context) throw new Error("Failed to acquire WebGPU canvas context");

      const format = navigator.gpu.getPreferredCanvasFormat();

      const uniformBuffer = device.createBuffer({
        size: 48,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const shaderCode = /* wgsl */`
struct Uniforms {
  params0 : vec4<f32>, // width, height, time, scale
  params1 : vec4<f32>, // speedZ, caContrast, caSamples, caSpread
  params2 : vec4<f32>, // caCenterX, caCenterY, _, _
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(1) @binding(0) var noiseSampler : sampler;
@group(1) @binding(1) var noiseTex : texture_2d<f32>;

fn fade(t: f32) -> f32 {
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

fn lerp1(a: f32, b: f32, t: f32) -> f32 {
  return a + t * (b - a);
}

fn fadePrime(t: f32) -> f32 {
  return 30.0 * t * t * (t - 1.0) * (t - 1.0);
}

fn hash3(p: vec3<i32>) -> u32 {
  let x = u32(p.x);
  let y = u32(p.y);
  let z = u32(p.z);
  var h = x * 374761393u + y * 668265263u + z * 2246822519u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  h = h ^ (h >> 16u);
  return h;
}

fn grad3(h: u32) -> vec3<f32> {
  let idx = i32(h % 12u);
  switch idx {
    case 0:  { return vec3<f32>( 1.0,  1.0,  0.0); }
    case 1:  { return vec3<f32>(-1.0,  1.0,  0.0); }
    case 2:  { return vec3<f32>( 1.0, -1.0,  0.0); }
    case 3:  { return vec3<f32>(-1.0, -1.0,  0.0); }
    case 4:  { return vec3<f32>( 1.0,  0.0,  1.0); }
    case 5:  { return vec3<f32>(-1.0,  0.0,  1.0); }
    case 6:  { return vec3<f32>( 1.0,  0.0, -1.0); }
    case 7:  { return vec3<f32>(-1.0,  0.0, -1.0); }
    case 8:  { return vec3<f32>( 0.0,  1.0,  1.0); }
    case 9:  { return vec3<f32>( 0.0, -1.0,  1.0); }
    case 10: { return vec3<f32>( 0.0,  1.0, -1.0); }
    default: { return vec3<f32>( 0.0, -1.0, -1.0); }
  }
}

fn perlin3(p: vec3<f32>) -> f32 {
  let pi = vec3<i32>(floor(p));
  let pf = fract(p);

  let u = fade(pf.x);
  let v = fade(pf.y);
  let w = fade(pf.z);

  let g000 = grad3(hash3(pi + vec3<i32>(0,0,0)));
  let g100 = grad3(hash3(pi + vec3<i32>(1,0,0)));
  let g010 = grad3(hash3(pi + vec3<i32>(0,1,0)));
  let g110 = grad3(hash3(pi + vec3<i32>(1,1,0)));
  let g001 = grad3(hash3(pi + vec3<i32>(0,0,1)));
  let g101 = grad3(hash3(pi + vec3<i32>(1,0,1)));
  let g011 = grad3(hash3(pi + vec3<i32>(0,1,1)));
  let g111 = grad3(hash3(pi + vec3<i32>(1,1,1)));

  let d000 = pf - vec3<f32>(0.0, 0.0, 0.0);
  let d100 = pf - vec3<f32>(1.0, 0.0, 0.0);
  let d010 = pf - vec3<f32>(0.0, 1.0, 0.0);
  let d110 = pf - vec3<f32>(1.0, 1.0, 0.0);
  let d001 = pf - vec3<f32>(0.0, 0.0, 1.0);
  let d101 = pf - vec3<f32>(1.0, 0.0, 1.0);
  let d011 = pf - vec3<f32>(0.0, 1.0, 1.0);
  let d111 = pf - vec3<f32>(1.0, 1.0, 1.0);

  let n000 = dot(g000, d000);
  let n100 = dot(g100, d100);
  let n010 = dot(g010, d010);
  let n110 = dot(g110, d110);
  let n001 = dot(g001, d001);
  let n101 = dot(g101, d101);
  let n011 = dot(g011, d011);
  let n111 = dot(g111, d111);

  let nx00 = lerp1(n000, n100, u);
  let nx10 = lerp1(n010, n110, u);
  let nx01 = lerp1(n001, n101, u);
  let nx11 = lerp1(n011, n111, u);

  let nxy0 = lerp1(nx00, nx10, v);
  let nxy1 = lerp1(nx01, nx11, v);

  let nxyz = lerp1(nxy0, nxy1, w);

  let scaled = nxyz * 1.2;
  return clamp(scaled, -1.0, 1.0);
}

fn perlinAlphaAtUV(uv: vec2<f32>) -> f32 {
  let width = U.params0.x;
  let height = U.params0.y;
  let time = U.params0.z;
  let scale = U.params0.w;
  let speedZ = U.params1.x;

  let minDim = min(width, height);
  let fragXY = uv * vec2<f32>(width, height);
  let xy = (fragXY - 0.5 * vec2<f32>(width, height)) / minDim + vec2<f32>(42.0, 42.0);

  let phase = perlin3(vec3<f32>(xy * (scale * 0.15) + vec2<f32>(5.2, -3.7), 0.0));
  let z = time * speedZ + phase * 3.5;
  let p = vec3<f32>(xy * scale + vec2<f32>(17.3, -9.1), z);

  let eps = 0.02;
  let nPlus = perlin3(p + vec3<f32>(0.0, 0.0, eps));
  let nMinus = perlin3(p - vec3<f32>(0.0, 0.0, eps));
  let dndz = (nPlus - nMinus) / (2.0 * eps);

  let env = max(fadePrime(fract(p.z)), 1e-3);
  return clamp(abs(dndz) / env * 0.1, 0.0, 1.0);
}

fn chromaticFromTexture(uv: vec2<f32>) -> vec4<f32> {
  let caContrast = U.params1.y;
  let caSamplesF = U.params1.z;
  let caSpread = U.params1.w;
  let caCenter = U.params2.xy;

  let sampleCount = max(2, i32(floor(caSamplesF + 0.5)));
  let denom = max(f32(sampleCount - 1), 1.0);

  var colorSum = vec3<f32>(0.0, 0.0, 0.0);
  var weightSum = vec3<f32>(0.0, 0.0, 0.0);
  var alphaSum = 0.0;
  var alphaWeightSum = 0.0;

  for (var si: i32 = 0; si < sampleCount; si = si + 1) {
    let i = f32(si) / denom;
    let offset = (i - 0.5) * caSpread;
    let coord = clamp(
      uv + (caCenter - uv) * offset,
      vec2<f32>(0.0, 0.0),
      vec2<f32>(1.0, 1.0)
    );

    let a = textureSampleLevel(noiseTex, noiseSampler, coord, 0.0).r;

    var weight = vec4<f32>(i, 1.0 - abs(i + i - 1.0), 1.0 - i, 0.5);
    weight = vec4<f32>(0.5, 0.5, 0.5, 0.5) + (weight - vec4<f32>(0.5, 0.5, 0.5, 0.5)) * caContrast;

    colorSum += vec3<f32>(a * a, a * a, a * a) * weight.rgb;
    weightSum += weight.rgb;
    alphaSum += a * a * weight.a;
    alphaWeightSum += weight.a;
  }

  let colorAvg = clamp(
    colorSum / max(weightSum, vec3<f32>(1e-4, 1e-4, 1e-4)),
    vec3<f32>(0.0, 0.0, 0.0),
    vec3<f32>(1.0, 1.0, 1.0)
  );
  let alphaAvg = clamp(alphaSum / max(alphaWeightSum, 1e-4), 0.0, 1.0);

  let color = sqrt(colorAvg);
  let alpha = sqrt(alphaAvg);
  let premul = min(color, vec3<f32>(alpha, alpha, alpha));

  return vec4<f32>(premul, alpha);
}

struct VSOut {
  @builtin(position) pos : vec4<f32>,
};

@vertex
fn vsMain(@builtin(vertex_index) vid: u32) -> VSOut {
  var p = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -1.0),
    vec2<f32>( 3.0, -1.0),
    vec2<f32>(-1.0,  3.0)
  );
  var out: VSOut;
  out.pos = vec4<f32>(p[vid], 0.0, 1.0);
  return out;
}

@fragment
fn fsNoise(@builtin(position) fragPos: vec4<f32>) -> @location(0) vec4<f32> {
  let uv = fragPos.xy / vec2<f32>(U.params0.x, U.params0.y);
  let a = perlinAlphaAtUV(uv);
  return vec4<f32>(a, a, a, 1.0);
}

@fragment
fn fsComposite(@builtin(position) fragPos: vec4<f32>) -> @location(0) vec4<f32> {
  let uv = fragPos.xy / vec2<f32>(U.params0.x, U.params0.y);
  return chromaticFromTexture(uv);
}
`;

      const module = device.createShaderModule({ code: shaderCode });

      const uniformBindGroupLayout = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: "uniform" } },
        ],
      });

      const sampleBindGroupLayout = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.FRAGMENT, sampler: { type: "filtering" } },
          { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: "float" } },
        ],
      });

      const noisePipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [uniformBindGroupLayout] }),
        vertex: { module, entryPoint: "vsMain" },
        fragment: { module, entryPoint: "fsNoise", targets: [{ format: "rgba8unorm" }] },
        primitive: { topology: "triangle-list" },
      });

      const compositePipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [uniformBindGroupLayout, sampleBindGroupLayout] }),
        vertex: { module, entryPoint: "vsMain" },
        fragment: { module, entryPoint: "fsComposite", targets: [{ format }] },
        primitive: { topology: "triangle-list" },
      });

      const uniformBindGroup = device.createBindGroup({
        layout: uniformBindGroupLayout,
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      const sampler = device.createSampler({
        magFilter: "linear",
        minFilter: "linear",
        mipmapFilter: "linear",
        addressModeU: "clamp-to-edge",
        addressModeV: "clamp-to-edge",
      });

      let offscreenTexture = null;
      let offscreenView = null;
      let sampleBindGroup = null;
      let configured = false;
      let offscreenW = 0;
      let offscreenH = 0;

      function ensureOffscreen(w, h) {
        if (offscreenTexture && offscreenW === w && offscreenH === h) return;

        if (offscreenTexture) offscreenTexture.destroy();

        offscreenTexture = device.createTexture({
          size: [w, h],
          format: "rgba8unorm",
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
        });

        offscreenView = offscreenTexture.createView();
        sampleBindGroup = device.createBindGroup({
          layout: sampleBindGroupLayout,
          entries: [
            { binding: 0, resource: sampler },
            { binding: 1, resource: offscreenView },
          ],
        });

        offscreenW = w;
        offscreenH = h;
      }

      function configure() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        const resized = canvas.width !== w || canvas.height !== h;

        if (resized) {
          canvas.width = w;
          canvas.height = h;
        }

        if (resized || !configured) {
          context.configure({
            device,
            format,
            alphaMode: "premultiplied",
          });
          ensureOffscreen(w, h);
          configured = true;
        }
      }

      activeConfigure = configure;
      configure();

      const scale = 8.0;
      const speedZ = 0.25;

      function frame(tMs) {
        configure();

        const t = tMs * 0.001;
        const w = canvas.width;
        const h = canvas.height;
        const ca = getCAParams();

        device.queue.writeBuffer(
          uniformBuffer,
          0,
          new Float32Array([
            w, h, t, scale,
            speedZ, ca.contrast, ca.samples, ca.spread,
            ca.centerX, ca.centerY, 0, 0
          ])
        );

        const encoder = device.createCommandEncoder();

        const noisePass = encoder.beginRenderPass({
          colorAttachments: [{
            view: offscreenView,
            loadOp: "clear",
            storeOp: "store",
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
          }],
        });

        noisePass.setPipeline(noisePipeline);
        noisePass.setBindGroup(0, uniformBindGroup);
        noisePass.draw(3);
        noisePass.end();

        const compositePass = encoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            loadOp: "clear",
            storeOp: "store",
            clearValue: { r: 0, g: 0, b: 0, a: 0 },
          }],
        });

        compositePass.setPipeline(compositePipeline);
        compositePass.setBindGroup(0, uniformBindGroup);
        compositePass.setBindGroup(1, sampleBindGroup);
        compositePass.draw(3);
        compositePass.end();

        device.queue.submit([encoder.finish()]);
        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);
    }

    async function startWebGL() {
      const gl = canvas.getContext("webgl2", {
        antialias: false,
        alpha: true,
        premultipliedAlpha: true,
      });
      if (!gl) throw new Error("WebGL not available");

      function compileShader(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          const info = gl.getShaderInfoLog(sh) || "";
          gl.deleteShader(sh);
          throw new Error(info);
        }
        return sh;
      }

      function createProgram(vsSrc, fsSrc) {
        const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
        const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.deleteShader(vs);
        gl.deleteShader(fs);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          const info = gl.getProgramInfoLog(prog) || "";
          gl.deleteProgram(prog);
          throw new Error(info);
        }
        return prog;
      }

      const vs300 = `#version 300 es
precision highp float;

const vec2 P[3] = vec2[3](
  vec2(-1.0, -1.0),
  vec2( 3.0, -1.0),
  vec2(-1.0,  3.0)
);

out vec2 v_uv;

void main() {
  vec2 pos = P[gl_VertexID];
  gl_Position = vec4(pos, 0.0, 1.0);
  v_uv = pos * 0.5 + 0.5;
}`;

      const fsNoise300 = `#version 300 es
precision highp float;
precision highp int;

in vec2 v_uv;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_scale;
uniform float u_speedZ;

out vec4 outColor;

float fade(float t){
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

float lerp1(float a, float b, float t){
  return a + t * (b - a);
}

float fadePrime(float t){
  return 30.0 * t * t * (t - 1.0) * (t - 1.0);
}

uint hash3(ivec3 p){
  uvec3 q = uvec3(p);
  uint h = q.x * 374761393u + q.y * 668265263u + q.z * 2246822519u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  h = (h ^ (h >> 16u));
  return h;
}

vec3 grad3(uint h){
  int idx = int(h % 12u);
  if (idx == 0)  return vec3( 1.0,  1.0,  0.0);
  if (idx == 1)  return vec3(-1.0,  1.0,  0.0);
  if (idx == 2)  return vec3( 1.0, -1.0,  0.0);
  if (idx == 3)  return vec3(-1.0, -1.0,  0.0);
  if (idx == 4)  return vec3( 1.0,  0.0,  1.0);
  if (idx == 5)  return vec3(-1.0,  0.0,  1.0);
  if (idx == 6)  return vec3( 1.0,  0.0, -1.0);
  if (idx == 7)  return vec3(-1.0,  0.0, -1.0);
  if (idx == 8)  return vec3( 0.0,  1.0,  1.0);
  if (idx == 9)  return vec3( 0.0, -1.0,  1.0);
  if (idx == 10) return vec3( 0.0,  1.0, -1.0);
  return vec3( 0.0, -1.0, -1.0);
}

float perlin3(vec3 p){
  ivec3 pi = ivec3(floor(p));
  vec3 pf = fract(p);

  float u = fade(pf.x);
  float v = fade(pf.y);
  float w = fade(pf.z);

  vec3 g000 = grad3(hash3(pi + ivec3(0,0,0)));
  vec3 g100 = grad3(hash3(pi + ivec3(1,0,0)));
  vec3 g010 = grad3(hash3(pi + ivec3(0,1,0)));
  vec3 g110 = grad3(hash3(pi + ivec3(1,1,0)));
  vec3 g001 = grad3(hash3(pi + ivec3(0,0,1)));
  vec3 g101 = grad3(hash3(pi + ivec3(1,0,1)));
  vec3 g011 = grad3(hash3(pi + ivec3(0,1,1)));
  vec3 g111 = grad3(hash3(pi + ivec3(1,1,1)));

  float n000 = dot(g000, pf - vec3(0.0,0.0,0.0));
  float n100 = dot(g100, pf - vec3(1.0,0.0,0.0));
  float n010 = dot(g010, pf - vec3(0.0,1.0,0.0));
  float n110 = dot(g110, pf - vec3(1.0,1.0,0.0));
  float n001 = dot(g001, pf - vec3(0.0,0.0,1.0));
  float n101 = dot(g101, pf - vec3(1.0,0.0,1.0));
  float n011 = dot(g011, pf - vec3(0.0,1.0,1.0));
  float n111 = dot(g111, pf - vec3(1.0,1.0,1.0));

  float nx00 = lerp1(n000, n100, u);
  float nx10 = lerp1(n010, n110, u);
  float nx01 = lerp1(n001, n101, u);
  float nx11 = lerp1(n011, n111, u);

  float nxy0 = lerp1(nx00, nx10, v);
  float nxy1 = lerp1(nx01, nx11, v);

  float nxyz = lerp1(nxy0, nxy1, w);

  float scaled = nxyz * 1.2;
  return clamp(scaled, -1.0, 1.0);
}

float perlinAlphaAtUV(vec2 uv){
  float width = u_resolution.x;
  float height = u_resolution.y;

  float minDim = min(width, height);
  vec2 fragXY = uv * vec2(width, height);
  vec2 xy = (fragXY - 0.5 * vec2(width, height)) / minDim + vec2(42.0);

  float phase = perlin3(vec3(xy * (u_scale * 0.15) + vec2(5.2, -3.7), 0.0));
  float z = u_time * u_speedZ + phase * 3.5;
  vec3 p = vec3(xy * u_scale + vec2(17.3, -9.1), z);

  float eps = 0.02;
  float nPlus  = perlin3(p + vec3(0.0, 0.0, eps));
  float nMinus = perlin3(p - vec3(0.0, 0.0, eps));
  float dndz = (nPlus - nMinus) / (2.0 * eps);

  float env = max(fadePrime(fract(p.z)), 1e-3);
  return clamp(abs(dndz) / env * 0.1, 0.0, 1.0);
}

void main(){
  vec2 uvScreen = vec2(v_uv.x, 1.0 - v_uv.y);
  float a = perlinAlphaAtUV(uvScreen);
  outColor = vec4(vec3(a), 1.0);
}`;

      const fsComposite300 = `#version 300 es
precision highp float;
precision highp int;

in vec2 v_uv;

uniform sampler2D u_noiseTex;
uniform float u_caContrast;
uniform float u_caSamples;
uniform float u_caSpread;
uniform vec2 u_caCenter;

out vec4 outColor;

vec4 chromaticFromTexture(vec2 uvScreen){
  int sampleCount = max(2, int(floor(u_caSamples + 0.5)));
  float denom = max(float(sampleCount - 1), 1.0);

  vec3 colorSum = vec3(0.0);
  vec3 weightSum = vec3(0.0);
  float alphaSum = 0.0;
  float alphaWeightSum = 0.0;

  for (int si = 0; si < sampleCount; ++si) {
    float i = float(si) / denom;
    float offset = (i - 0.5) * u_caSpread;
    vec2 coord = clamp(uvScreen + (u_caCenter - uvScreen) * offset, 0.0, 1.0);
    vec2 texCoord = vec2(coord.x, 1.0 - coord.y);

    float a = texture(u_noiseTex, texCoord).r;

    vec4 weight = vec4(i, 1.0 - abs(i + i - 1.0), 1.0 - i, 0.5);
    weight = vec4(0.5) + (weight - vec4(0.5)) * u_caContrast;

    colorSum += vec3(a * a) * weight.rgb;
    weightSum += weight.rgb;
    alphaSum += a * a * weight.a;
    alphaWeightSum += weight.a;
  }

  vec3 colorAvg = clamp(colorSum / max(weightSum, vec3(1e-4)), 0.0, 1.0);
  float alphaAvg = clamp(alphaSum / max(alphaWeightSum, 1e-4), 0.0, 1.0);

  vec3 color = sqrt(colorAvg);
  float alpha = sqrt(alphaAvg);
  vec3 premul = min(color, vec3(alpha));

  return vec4(premul, alpha);
}

void main(){
  vec2 uvScreen = vec2(v_uv.x, 1.0 - v_uv.y);
  outColor = chromaticFromTexture(uvScreen);
}`;

      const noiseProgram = createProgram(vs300, fsNoise300);
      const compositeProgram = createProgram(vs300, fsComposite300);

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.bindVertexArray(null);

      const noise_uRes = gl.getUniformLocation(noiseProgram, "u_resolution");
      const noise_uTime = gl.getUniformLocation(noiseProgram, "u_time");
      const noise_uScale = gl.getUniformLocation(noiseProgram, "u_scale");
      const noise_uSpeed = gl.getUniformLocation(noiseProgram, "u_speedZ");

      const comp_uNoiseTex = gl.getUniformLocation(compositeProgram, "u_noiseTex");
      const comp_uCAContrast = gl.getUniformLocation(compositeProgram, "u_caContrast");
      const comp_uCASamples = gl.getUniformLocation(compositeProgram, "u_caSamples");
      const comp_uCASpread = gl.getUniformLocation(compositeProgram, "u_caSpread");
      const comp_uCACenter = gl.getUniformLocation(compositeProgram, "u_caCenter");

      let offscreenTex = null;
      let offscreenFbo = null;
      let offscreenW = 0;
      let offscreenH = 0;

      function createOffscreen(w, h) {
        if (offscreenTex) gl.deleteTexture(offscreenTex);
        if (offscreenFbo) gl.deleteFramebuffer(offscreenFbo);

        offscreenTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, offscreenTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

        offscreenFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, offscreenFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, offscreenTex, 0);

        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
          throw new Error(`Framebuffer incomplete: ${status}`);
        }

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);

        offscreenW = w;
        offscreenH = h;
      }

      function configure() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        const resized = canvas.width !== w || canvas.height !== h;

        if (resized) {
          canvas.width = w;
          canvas.height = h;
        }

        if (!offscreenTex || offscreenW !== w || offscreenH !== h) {
          createOffscreen(w, h);
        }
      }

      activeConfigure = configure;
      configure();

      const scale = 8.0;
      const speedZ = 0.25;

      gl.clearColor(0, 0, 0, 0);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.CULL_FACE);
      gl.disable(gl.BLEND);

      function frame(tMs) {
        configure();

        const t = tMs * 0.001;
        const ca = getCAParams();

        gl.bindVertexArray(vao);

        gl.bindFramebuffer(gl.FRAMEBUFFER, offscreenFbo);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(noiseProgram);
        gl.uniform2f(noise_uRes, canvas.width, canvas.height);
        gl.uniform1f(noise_uTime, t);
        gl.uniform1f(noise_uScale, scale);
        gl.uniform1f(noise_uSpeed, speedZ);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(compositeProgram);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, offscreenTex);
        gl.uniform1i(comp_uNoiseTex, 0);
        gl.uniform1f(comp_uCAContrast, ca.contrast);
        gl.uniform1f(comp_uCASamples, ca.samples);
        gl.uniform1f(comp_uCASpread, ca.spread);
        gl.uniform2f(comp_uCACenter, ca.centerX, ca.centerY);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindVertexArray(null);

        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);
    }

    updateModeButtonLabel();
    applyBackground();
    await start(navigator.gpu ? "webgpu" : "webgl");
  </script>
