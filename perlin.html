  <script type="module">
    function createPerlinAnimation(initialCanvas, options = {}) {
      let canvas = initialCanvas;

      const state = {
        color: options.color ?? "#ffffff",
        opacity: options.opacity ?? 1,
        backgroundColor: options.backgroundColor ?? "#000000",
        backgroundOpacity: options.backgroundOpacity ?? 0,
        scale: options.scale ?? 1,
        x: options.x ?? 42,
        y: options.y ?? 42,
        caContrast: options.caContrast ?? 1,
        caSamples: options.caSamples ?? 32,
        caSpread: options.caSpread ?? 0.025,
        caCenterX: options.caCenterX ?? 0.5,
        caCenterY: options.caCenterY ?? 0.5,
        forceMode: options.forceMode ?? null,
      };

      const renderOptions = {
        autoStart: options.autoStart ?? true,
        fixedPixelWidth: options.fixedPixelWidth ?? null,
        fixedPixelHeight: options.fixedPixelHeight ?? null,
        preferStableCapture: options.preferStableCapture ?? false,
      };

      const BASE_SCALE = 8.0;
      const SPEED_Z = 0.25;

      const parseHexColor = (hex) => {
        let h = String(hex || "#ffffff").replace("#", "");
        if (h.length === 3) h = h.split("").map((c) => c + c).join("");
        const num = parseInt(h, 16);
        if (!Number.isFinite(num)) return [1, 1, 1];
        return [
          ((num >> 16) & 255) / 255,
          ((num >> 8) & 255) / 255,
          (num & 255) / 255,
        ];
      };

      const normalizeCASamples = (value) => {
        let s = Math.round(value);
        s = Math.max(2, s);
        if (s % 2 !== 0) s += 1;
        return s;
      };

      function getCAParams() {
        return {
          contrast: state.caContrast,
          samples: normalizeCASamples(state.caSamples),
          spread: state.caSpread,
          centerX: state.caCenterX,
          centerY: state.caCenterY,
        };
      }

      function getScaleParams() {
        const userScale = Math.max(state.scale, 0.001);
        return {
          finalScale: BASE_SCALE / userScale,
          adjustedX: state.x * userScale,
          adjustedY: state.y * userScale,
        };
      }

      function getColorRgb() {
        return parseHexColor(state.color);
      }

      function getBackgroundRgb() {
        return parseHexColor(state.backgroundColor);
      }

      function getTargetPixelSize() {
        if (renderOptions.fixedPixelWidth != null && renderOptions.fixedPixelHeight != null) {
          return {
            width: Math.max(1, Math.floor(renderOptions.fixedPixelWidth)),
            height: Math.max(1, Math.floor(renderOptions.fixedPixelHeight)),
          };
        }

        const dpr = Math.max(1, window.devicePixelRatio || 1);
        return {
          width: Math.max(1, Math.floor(canvas.clientWidth * dpr)),
          height: Math.max(1, Math.floor(canvas.clientHeight * dpr)),
        };
      }

      let currentMode = null;
      let rafId = 0;
      let activeConfigure = null;
      let destroyed = false;
      let canvasTainted = false;
      let currentBackend = null;

      const modes = ["webgpu", "webgl"];

      const resizeHandler = () => {
        if (destroyed) return;
        if (renderOptions.fixedPixelWidth == null || renderOptions.fixedPixelHeight == null) {
          if (activeConfigure) activeConfigure();
        }
      };
      window.addEventListener("resize", resizeHandler, { passive: true });

      function stopLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
      }

      function startLoop() {
        if (destroyed || !currentBackend || !renderOptions.autoStart || rafId) return;

        const tick = (tMs) => {
          if (destroyed || !currentBackend || !renderOptions.autoStart) {
            rafId = 0;
            return;
          }
          currentBackend.renderAt(tMs * 0.001, false);
          rafId = requestAnimationFrame(tick);
        };

        rafId = requestAnimationFrame(tick);
      }

      function stopActive() {
        stopLoop();
        activeConfigure = null;
        if (currentBackend && typeof currentBackend.destroy === "function") {
          try { currentBackend.destroy(); } catch (e) {}
        }
        currentBackend = null;
        currentMode = null;
      }

      function replaceCanvas() {
        const fresh = document.createElement("canvas");
        fresh.id = canvas.id;
        fresh.className = canvas.className;
        fresh.style.cssText = canvas.style.cssText;
        fresh.width = canvas.width;
        fresh.height = canvas.height;
        if (canvas.parentNode) {
          canvas.parentNode.replaceChild(fresh, canvas);
        }
        canvas = fresh;
        canvasTainted = false;
      }

      async function initWebGPU() {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("No GPU adapter found");

        const device = await adapter.requestDevice();
        const context = canvas.getContext("webgpu");
        if (!context) throw new Error("Failed to acquire WebGPU canvas context");

        const format = navigator.gpu.getPreferredCanvasFormat();

        const uniformBuffer = device.createBuffer({
          size: 80,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        const shaderCode = /* wgsl */`
struct Uniforms {
  params0 : vec4<f32>,
  params1 : vec4<f32>,
  params2 : vec4<f32>,
  params3 : vec4<f32>,
  params4 : vec4<f32>,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(1) @binding(0) var noiseSampler : sampler;
@group(1) @binding(1) var noiseTex : texture_2d<f32>;

fn fade(t: f32) -> f32 {
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

fn lerp1(a: f32, b: f32, t: f32) -> f32 {
  return a + t * (b - a);
}

fn fadePrime(t: f32) -> f32 {
  return 30.0 * t * t * (t - 1.0) * (t - 1.0);
}

fn hash3(p: vec3<i32>) -> u32 {
  let x = u32(p.x);
  let y = u32(p.y);
  let z = u32(p.z);
  var h = x * 374761393u + y * 668265263u + z * 2246822519u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  h = h ^ (h >> 16u);
  return h;
}

fn grad3(h: u32) -> vec3<f32> {
  let idx = i32(h % 12u);
  switch idx {
    case 0:  { return vec3<f32>( 1.0,  1.0,  0.0); }
    case 1:  { return vec3<f32>(-1.0,  1.0,  0.0); }
    case 2:  { return vec3<f32>( 1.0, -1.0,  0.0); }
    case 3:  { return vec3<f32>(-1.0, -1.0,  0.0); }
    case 4:  { return vec3<f32>( 1.0,  0.0,  1.0); }
    case 5:  { return vec3<f32>(-1.0,  0.0,  1.0); }
    case 6:  { return vec3<f32>( 1.0,  0.0, -1.0); }
    case 7:  { return vec3<f32>(-1.0,  0.0, -1.0); }
    case 8:  { return vec3<f32>( 0.0,  1.0,  1.0); }
    case 9:  { return vec3<f32>( 0.0, -1.0,  1.0); }
    case 10: { return vec3<f32>( 0.0,  1.0, -1.0); }
    default: { return vec3<f32>( 0.0, -1.0, -1.0); }
  }
}

fn perlin3(p: vec3<f32>) -> f32 {
  let pi = vec3<i32>(floor(p));
  let pf = fract(p);

  let u = fade(pf.x);
  let v = fade(pf.y);
  let w = fade(pf.z);

  let g000 = grad3(hash3(pi + vec3<i32>(0,0,0)));
  let g100 = grad3(hash3(pi + vec3<i32>(1,0,0)));
  let g010 = grad3(hash3(pi + vec3<i32>(0,1,0)));
  let g110 = grad3(hash3(pi + vec3<i32>(1,1,0)));
  let g001 = grad3(hash3(pi + vec3<i32>(0,0,1)));
  let g101 = grad3(hash3(pi + vec3<i32>(1,0,1)));
  let g011 = grad3(hash3(pi + vec3<i32>(0,1,1)));
  let g111 = grad3(hash3(pi + vec3<i32>(1,1,1)));

  let d000 = pf - vec3<f32>(0.0, 0.0, 0.0);
  let d100 = pf - vec3<f32>(1.0, 0.0, 0.0);
  let d010 = pf - vec3<f32>(0.0, 1.0, 0.0);
  let d110 = pf - vec3<f32>(1.0, 1.0, 0.0);
  let d001 = pf - vec3<f32>(0.0, 0.0, 1.0);
  let d101 = pf - vec3<f32>(1.0, 0.0, 1.0);
  let d011 = pf - vec3<f32>(0.0, 1.0, 1.0);
  let d111 = pf - vec3<f32>(1.0, 1.0, 1.0);

  let n000 = dot(g000, d000);
  let n100 = dot(g100, d100);
  let n010 = dot(g010, d010);
  let n110 = dot(g110, d110);
  let n001 = dot(g001, d001);
  let n101 = dot(g101, d101);
  let n011 = dot(g011, d011);
  let n111 = dot(g111, d111);

  let nx00 = lerp1(n000, n100, u);
  let nx10 = lerp1(n010, n110, u);
  let nx01 = lerp1(n001, n101, u);
  let nx11 = lerp1(n011, n111, u);

  let nxy0 = lerp1(nx00, nx10, v);
  let nxy1 = lerp1(nx01, nx11, v);

  return clamp(lerp1(nxy0, nxy1, w) * 1.2, -1.0, 1.0);
}

fn perlinAlphaAtUV(uv: vec2<f32>) -> f32 {
  let width   = U.params0.x;
  let height  = U.params0.y;
  let time    = U.params0.z;
  let scale   = U.params0.w;
  let speedZ  = U.params1.x;
  let offsetX = U.params1.z;
  let offsetY = U.params1.w;

  let minDim = min(width, height);
  let fragXY = uv * vec2<f32>(width, height);
  let xy = (fragXY - 0.5 * vec2<f32>(width, height)) / minDim + vec2<f32>(offsetX, offsetY);

  let phase = perlin3(vec3<f32>(xy * (scale * 0.15) + vec2<f32>(5.2, -3.7), 0.0));
  let z = time * speedZ + phase * 3.5;
  let p = vec3<f32>(xy * scale + vec2<f32>(17.3, -9.1), z);

  let eps = 0.02;
  let nPlus  = perlin3(p + vec3<f32>(0.0, 0.0, eps));
  let nMinus = perlin3(p - vec3<f32>(0.0, 0.0, eps));
  let dndz = (nPlus - nMinus) / (2.0 * eps);

  let env = max(fadePrime(fract(p.z)), 1e-3);
  return clamp(abs(dndz) / env * 0.1, 0.0, 1.0);
}

fn chromaticFromTexture(uv: vec2<f32>) -> vec4<f32> {
  let caContrast = U.params2.x;
  let caSamplesF = U.params2.y;
  let caSpread   = U.params2.z;
  let caCenter   = vec2<f32>(U.params2.w, U.params3.x);

  let sampleCount = max(2, i32(floor(caSamplesF + 0.5)));
  let denom = max(f32(sampleCount - 1), 1.0);

  var colorSum       = vec3<f32>(0.0);
  var weightSum      = vec3<f32>(0.0);
  var alphaSum       = 0.0;
  var alphaWeightSum = 0.0;

  for (var si: i32 = 0; si < sampleCount; si = si + 1) {
    let i = f32(si) / denom;
    let offset = (i - 0.5) * caSpread;
    let coord = clamp(uv + (caCenter - uv) * offset, vec2<f32>(0.0), vec2<f32>(1.0));

    let a = textureSampleLevel(noiseTex, noiseSampler, coord, 0.0).r;

    var weight = vec4<f32>(i, 1.0 - abs(i + i - 1.0), 1.0 - i, 0.5);
    weight = vec4<f32>(0.5) + (weight - vec4<f32>(0.5)) * caContrast;

    colorSum  += vec3<f32>(a * a) * weight.rgb;
    weightSum += weight.rgb;
    alphaSum       += a * a * weight.a;
    alphaWeightSum += weight.a;
  }

  let colorAvg = clamp(colorSum / max(weightSum, vec3<f32>(1e-4)), vec3<f32>(0.0), vec3<f32>(1.0));
  let alphaAvg = clamp(alphaSum / max(alphaWeightSum, 1e-4), 0.0, 1.0);

  let color = sqrt(colorAvg);
  let alpha = sqrt(alphaAvg);
  return vec4<f32>(min(color, vec3<f32>(alpha)), alpha);
}

@fragment

@fragment
fn fsComposite(@builtin(position) fragPos: vec4<f32>) -> @location(0) vec4<f32> {

  let outAlpha  = srcAlpha + bgOpacity * (1.0 - srcAlpha);

      const next = modes[(idx + 1 + modes.length) % modes.length];
      toggleModeBtn.textContent = `Switch to ${modeLabel(next)}`;
      statusEl.textContent = `Mode: ${modeLabel(m)} - Background: ${bgMode === "image" ? "Image" : "Black"}`;

    const exportInputs = {

    const exportSupportState = {
      ready: false,

    const exportState = {
      busy: false,
      cancelRequested: false,
      cancelController: null,
      instance: null,
      previewUrl: "",

    function getExportCanvasElement() {
      return document.getElementById("exportCanvasPreview");
    }

    function revokePreviewUrl() {
      if (exportState.previewUrl) {
        URL.revokeObjectURL(exportState.previewUrl);
        exportState.previewUrl = "";

    }

    function setExportStatus(text, isError = false) {
      exportStatusEl.textContent = text;
      exportStatusEl.style.color = isError ? "#fca5a5" : "#d4d4d8";
    }

    function setExportProgress(percent) {
      const p = Math.max(0, Math.min(100, percent));
      exportProgressBarEl.style.width = `${p}%`;
    }

    function formatBytes(bytes) {
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2)} ${units[unit]}`;
    }

    function clampNumber(value, min, max, fallback) {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function readExportSettings() {
      return {
        fps: Math.round(clampNumber(exportInputs.fps.value, 1, 1000, 30)),
        duration: clampNumber(exportInputs.duration.value, 0.001, 3600, 10),
        width: Math.round(clampNumber(exportInputs.width.value, 1, 32768, 1024)),
        height: Math.round(clampNumber(exportInputs.height.value, 1, 32768, 1024)),
        color: exportInputs.color.value || "#ffffff",
        opacity: clampNumber(exportInputs.opacity.value, 0, 1, 1),
        backgroundColor: exportInputs.backgroundColor.value || "#000000",
        backgroundOpacity: clampNumber(exportInputs.backgroundOpacity.value, 0, 1, 1),
        scale: clampNumber(exportInputs.scale.value, 0.001, 1000, 1),
        x: clampNumber(exportInputs.x.value, -1000000, 1000000, 42),
        y: clampNumber(exportInputs.y.value, -1000000, 1000000, 42),
        caContrast: clampNumber(exportInputs.caContrast.value, -100, 100, 1),
        caSamples: Math.round(clampNumber(exportInputs.caSamples.value, 2, 65536, 32)),
        caSpread: clampNumber(exportInputs.caSpread.value, -100, 100, 0.025),
        caCenterX: clampNumber(exportInputs.caCenterX.value, -100, 100, 0.5),
        caCenterY: clampNumber(exportInputs.caCenterY.value, -100, 100, 0.5),
        forceMode: exportInputs.forceMode.value || null,
      };
    }

    function estimateVideoBitrate(width, height, fps, codec) {
      const pixelsPerSecond = width * height * fps;
      let factor = 0.18;
      if (codec === "av1") factor = 0.04;
      else if (codec === "h265") factor = 0.14;
      else if (codec === "h264") factor = 0.2;
      else if (codec === "vp9") factor = 0.15;
      else if (codec === "vp8") factor = 0.18;
      const bitrate = Math.round(pixelsPerSecond * factor);
      return Math.max(500_000, Math.min(50_000_000, bitrate));
    }

    function getSelectedExportFormat() {
      const container = expContainerEl.value;
      const codec = expCodecEl.value;
      return exportFormats.find((f) => f.container === container && f.codec === codec) || null;
    }

    function makeCancelError() {
      const err = new Error("__EXPORT_CANCELLED__");
      err.code = "EXPORT_CANCELLED";
      return err;
    }

    function isCancelError(error) {
      return !!error && (error.code === "EXPORT_CANCELLED" || error.message === "__EXPORT_CANCELLED__");
    }

    function createCancelController() {
      let aborted = false;
      let rejectPromise = null;

      const promise = new Promise((_, reject) => {
        rejectPromise = reject;
      });

      return {
        get aborted() {
          return aborted;
        },
        cancel() {
          if (aborted) return;
          aborted = true;
          rejectPromise(makeCancelError());
        },
        throwIfCancelled() {
          if (aborted) throw makeCancelError();
        },
        promise,
      };
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function sleepCancelable(ms, controller) {
      controller.throwIfCancelled();
      await Promise.race([sleep(ms), controller.promise]);
      controller.throwIfCancelled();
    }

    async function yieldToMainThread(controller) {
      await sleepCancelable(0, controller);
    }

    function makeMimeType(container, codecString) {
      const base = container === "mp4" ? "video/mp4" : "video/webm";
      return codecString ? `${base};codecs=${codecString}` : base;
    }

    const H264_LEVELS = [
      { hex: "1e", maxFS: 1620, maxMBPS: 40500 },
      { hex: "1f", maxFS: 3600, maxMBPS: 108000 },
      { hex: "20", maxFS: 5120, maxMBPS: 216000 },
      { hex: "28", maxFS: 8192, maxMBPS: 245760 },
      { hex: "29", maxFS: 8192, maxMBPS: 245760 },
      { hex: "2a", maxFS: 8704, maxMBPS: 522240 },
      { hex: "32", maxFS: 22080, maxMBPS: 589824 },
      { hex: "33", maxFS: 36864, maxMBPS: 983040 },
      { hex: "34", maxFS: 36864, maxMBPS: 2073600 },
    ];

    function getH264RequiredLevelStartIndex(settings) {
      const mbWidth = Math.ceil(settings.width / 16);
      const mbHeight = Math.ceil(settings.height / 16);
      const frameMacroblocks = mbWidth * mbHeight;
      const macroblocksPerSecond = frameMacroblocks * settings.fps;

      let index = 0;
      while (
        index < H264_LEVELS.length &&
        (frameMacroblocks > H264_LEVELS[index].maxFS || macroblocksPerSecond > H264_LEVELS[index].maxMBPS)
      ) {
        index += 1;
      }

      return Math.min(index, H264_LEVELS.length - 1);
    }

    function getH264CodecCandidates(settings) {
      const prefixes = [
        "42e0",
        "4200",
        "4d00",
        "6400",
      ];

      const startIndex = getH264RequiredLevelStartIndex(settings);
      const codecs = [];
      const seen = new Set();

      for (let i = startIndex; i < H264_LEVELS.length; i += 1) {
        const levelHex = H264_LEVELS[i].hex;
        for (const prefix of prefixes) {
          const codec = `avc1.${prefix}${levelHex}`;
          if (!seen.has(codec)) {
            seen.add(codec);
            codecs.push(codec);
          }
        }
      }

      for (let i = startIndex - 1; i >= 0; i -= 1) {
        const levelHex = H264_LEVELS[i].hex;
        for (const prefix of prefixes) {
          const codec = `avc1.${prefix}${levelHex}`;
          if (!seen.has(codec)) {
            seen.add(codec);
            codecs.push(codec);
          }
        }
      }

      return codecs;
    }

    function createVideoFrameCaptureSurface(width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { alpha: true, desynchronized: false });
      if (!ctx) throw new Error("Failed to create a 2D capture surface.");
      ctx.imageSmoothingEnabled = true;
      return { canvas, ctx, width, height };
    }

    function copyCanvasToCaptureSurface(sourceCanvas, captureSurface) {
      const { ctx, width, height } = captureSurface;
      ctx.save();
      ctx.globalCompositeOperation = "copy";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(sourceCanvas, 0, 0, width, height);
      ctx.restore();
    }

    function getVideoEncoderConfigCandidates(format, settings) {
      const base = {
        codec: format.encoderCodec,
        width: settings.width,
        height: settings.height,
        bitrate: estimateVideoBitrate(settings.width, settings.height, settings.fps, format.codec),
        framerate: settings.fps,
      };

      const candidates = [];
      const seen = new Set();

      const pushCandidate = (config) => {
        const key = JSON.stringify(config);
        if (seen.has(key)) return;
        seen.add(key);
        candidates.push(config);
      };

      if (format.codec === "h264") {
        const h264Codecs = getH264CodecCandidates(settings);

        for (const codec of h264Codecs) {
          const codecBase = { ...base, codec };

          pushCandidate({
            ...codecBase,
            bitrateMode: "variable",
            latencyMode: "realtime",
            avc: { format: "avc" },
          });

          pushCandidate({
            ...codecBase,
            latencyMode: "realtime",
            avc: { format: "avc" },
          });

          pushCandidate({
            ...codecBase,
            avc: { format: "avc" },
          });

          pushCandidate({
            ...codecBase,
            bitrateMode: "variable",
            latencyMode: "realtime",
            avc: { format: "annexb" },
          });

          pushCandidate({
            ...codecBase,
            avc: { format: "annexb" },
          });

          pushCandidate({
            ...codecBase,
            bitrateMode: "variable",
            latencyMode: "realtime",
          });

          pushCandidate(codecBase);
        }

        return candidates;
      }

      pushCandidate({
        ...base,
        bitrateMode: "variable",
        latencyMode: "realtime",
      });

      pushCandidate({
        ...base,
        latencyMode: "realtime",
      });

      pushCandidate({
        ...base,
        bitrateMode: "variable",
      });

      pushCandidate(base);

      return candidates;
    }

    async function pickSupportedVideoEncoderConfig(format, settings) {
      if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") return null;

      const candidates = getVideoEncoderConfigCandidates(format, settings);
      for (const candidate of candidates) {
        try {
          const support = await VideoEncoder.isConfigSupported(candidate);
          if (support && support.supported) {
            return support.config || candidate;
          }
        } catch (e) {}
      }

      return null;
    }

    function resetPreviewSurface(width, height) {
      const canvas = getExportCanvasElement();
      canvas.classList.remove("hidden");
      canvas.width = width;
      canvas.height = height;

      exportVideoPreview.pause();
      exportVideoPreview.removeAttribute("src");
      exportVideoPreview.load();
      exportVideoPreview.classList.add("hidden");

      downloadExportLink.classList.add("hidden");
      downloadExportLink.removeAttribute("href");

      exportResultInfoEl.textContent = "";
      setExportProgress(0);
    }

    function cleanupExportRuntime() {
      if (exportState.instance) {
        try { exportState.instance.destroy(); } catch (e) {}
      }
      exportState.instance = null;
      exportState.cancelController = null;
    }

    async function loadMuxerModules() {
      const [webmResult, mp4Result] = await Promise.allSettled([
        import("https://cdn.jsdelivr.net/npm/webm-muxer/+esm"),
        import("https://cdn.jsdelivr.net/npm/mp4-muxer/+esm"),
      ]);

      if (webmResult.status === "fulfilled") {
        exportSupportState.webmMuxer = webmResult.value;
      }

      if (mp4Result.status === "fulfilled") {
        exportSupportState.mp4Muxer = mp4Result.value;
      }
    }

    async function detectFormatSupport(format) {
      if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") return false;

      if (format.muxerKind === "webm" && !exportSupportState.webmMuxer) return false;
      if (format.muxerKind === "mp4" && !exportSupportState.mp4Muxer) return false;

      try {
        const config = await pickSupportedVideoEncoderConfig(format, {
          width: 640,
          height: 360,
          fps: 30,
        });
        return !!config;
      } catch (e) {
        return false;
      }
    }

    async function initializeExportSupport() {
      exportSupportState.loading = true;
      exportSupportState.ready = false;
      exportSupportState.error = "";

      try {
        await loadMuxerModules();

        exportFormats = await Promise.all(
          exportFormatDefs.map(async (format) => ({
            ...format,
            supported: await detectFormatSupport(format),
          }))
        );

        exportSupportState.ready = true;
      } catch (e) {
        exportSupportState.error = e && e.message ? e.message : String(e);
        exportFormats = exportFormatDefs.map((format) => ({
          ...format,
          supported: false,
        }));
      } finally {
        exportSupportState.loading = false;
        refreshContainerOptions();
        refreshEncodingInfo();
        syncExportButtons();
      }
    }

    function createMuxerForFormat(format, settings) {
      if (format.muxerKind === "webm") {
        const { Muxer, ArrayBufferTarget } = exportSupportState.webmMuxer;
        const target = new ArrayBufferTarget();
        const muxer = new Muxer({
          target,
          video: {
            codec: format.muxerCodec,
            width: settings.width,
            height: settings.height,
            frameRate: settings.fps,
          },
          firstTimestampBehavior: "offset",
        });

        return {
          addVideoChunk(chunk, meta) {
            muxer.addVideoChunk(chunk, meta);
          },
          finalize() {
            muxer.finalize();
            return target.buffer;
          },
        };
      }

      if (format.muxerKind === "mp4") {
        const { Muxer, ArrayBufferTarget } = exportSupportState.mp4Muxer;
        const target = new ArrayBufferTarget();
        const muxer = new Muxer({
          target,
          fastStart: "in-memory",
          video: {
            codec: format.muxerCodec,
            width: settings.width,
            height: settings.height,
            frameRate: settings.fps,
          },
        });

        return {
          addVideoChunk(chunk, meta) {
            muxer.addVideoChunk(chunk, meta);
          },
          finalize() {
            muxer.finalize();
            return target.buffer;
          },
        };
      }

      throw new Error("Unsupported muxer kind.");
    }

    function refreshCodecOptions() {
      const currentCodec = expCodecEl.value;
      const selectedContainer = expContainerEl.value;
      const formats = exportFormats.filter((f) => f.container === selectedContainer);

      expCodecEl.innerHTML = "";
      let firstSupportedCodec = "";

      for (const format of formats) {
        const opt = document.createElement("option");
        opt.value = format.codec;
        opt.textContent = format.supported ? format.label : `${format.label} (unsupported)`;
        opt.disabled = !format.supported;
        expCodecEl.appendChild(opt);
        if (format.supported && !firstSupportedCodec) firstSupportedCodec = format.codec;
      }

      const hasCurrentSupported = formats.some((f) => f.codec === currentCodec && f.supported);
      if (hasCurrentSupported) expCodecEl.value = currentCodec;
      else expCodecEl.value = firstSupportedCodec;

      refreshEncodingInfo();
    }

    function refreshContainerOptions() {
      const currentContainer = expContainerEl.value;
      expContainerEl.innerHTML = "";
      let firstSupportedContainer = "";

      for (const container of exportContainers) {
        const hasSupported = exportFormats.some((f) => f.container === container.value && f.supported);
        const opt = document.createElement("option");
        opt.value = container.value;
        opt.textContent = hasSupported ? container.label : `${container.label} (unsupported)`;
        opt.disabled = !hasSupported;
        expContainerEl.appendChild(opt);
        if (hasSupported && !firstSupportedContainer) firstSupportedContainer = container.value;
      }

      const currentStillSupported = exportFormats.some((f) => f.container === currentContainer && f.supported);
      if (currentStillSupported) expContainerEl.value = currentContainer;
      else expContainerEl.value = firstSupportedContainer;

      refreshCodecOptions();
    }

    function refreshEncodingInfo() {
      if (!exportSupportState.ready) {
        exportEncodingInfoEl.textContent =
          exportSupportState.loading
            ? "Checking offline codec support..."
            : exportSupportState.error
              ? `Offline export unavailable: ${exportSupportState.error}`
              : "Offline export support not ready yet.";
        syncExportButtons();
        return;
      }

      if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") {
        exportEncodingInfoEl.textContent = "WebCodecs is not available in this browser.";
        syncExportButtons();
        return;
      }

      const format = getSelectedExportFormat();
      if (!format || !format.supported) {
        exportEncodingInfoEl.textContent = "No supported offline container and codec pair is currently selected.";
      } else {
        const settings = readExportSettings();
        const bitrate = estimateVideoBitrate(settings.width, settings.height, settings.fps, format.codec);
        exportEncodingInfoEl.textContent =
          `Offline encode: ${format.container.toUpperCase()} / ${format.label} - ${format.mimeType} - est. ${(bitrate / 1000000).toFixed(2)} Mbps`;
      }

      syncExportButtons();
    }

    function syncExportButtons() {
      const format = getSelectedExportFormat();
      startExportBtn.disabled =
        exportState.busy ||
        !exportSupportState.ready ||
        !format ||
        !format.supported;

      cancelExportBtn.disabled = !exportState.busy;
      closeExportBtn.disabled = exportState.busy;
      expContainerEl.disabled = exportState.busy || !exportSupportState.ready;
      expCodecEl.disabled = exportState.busy || !exportSupportState.ready;

      for (const el of Object.values(exportInputs)) {
        el.disabled = exportState.busy;
      }
    }

    function showExportOverlay() {
      exportOverlay.classList.remove("hidden");
      exportOverlay.classList.add("flex");
      refreshContainerOptions();
      refreshEncodingInfo();
      syncExportButtons();
    }

    function hideExportOverlay() {
      if (exportState.busy) return;
      exportOverlay.classList.add("hidden");
      exportOverlay.classList.remove("flex");
    }

    async function generateExportVideo() {
      if (exportState.busy) return;

      const format = getSelectedExportFormat();
      if (!format || !format.supported) {
        setExportStatus("Selected offline encoding is not supported in this browser.", true);
        syncExportButtons();
        return;
      }

      const settings = readExportSettings();
      revokePreviewUrl();
      resetPreviewSurface(settings.width, settings.height);

      exportState.busy = true;
      exportState.cancelRequested = false;
      exportState.cancelController = createCancelController();
      syncExportButtons();

      setExportStatus("Initializing renderer...");
      instance.pause();

      let encoder = null;

      try {
        const previewCanvas = getExportCanvasElement();
        const exportInstance = createPerlinAnimation(previewCanvas, {
          color: settings.color,
          opacity: settings.opacity,
          backgroundColor: settings.backgroundColor,
          backgroundOpacity: settings.backgroundOpacity,
          scale: settings.scale,
          x: settings.x,
          y: settings.y,
          caContrast: settings.caContrast,
          caSamples: settings.caSamples,
          caSpread: settings.caSpread,
          caCenterX: settings.caCenterX,
          caCenterY: settings.caCenterY,
          forceMode: settings.forceMode,
          autoStart: false,
          fixedPixelWidth: settings.width,
          fixedPixelHeight: settings.height,
          preferStableCapture: true,
        });

        exportState.instance = exportInstance;
        await exportInstance._ready;
        exportState.cancelController.throwIfCancelled();

        if (!exportInstance.mode) {
          throw new Error("Failed to initialize the requested rendering backend for export.");
        }

        const sourceCanvas = exportInstance.canvas;
        sourceCanvas.classList.remove("hidden");

        const encoderConfig = await pickSupportedVideoEncoderConfig(format, settings);
        exportState.cancelController.throwIfCancelled();

        if (!encoderConfig) {
          throw new Error("The selected codec is not supported for this resolution or frame rate.");
        }

        const outputMimeType = makeMimeType(format.container, encoderConfig.codec || "");
        const captureSurface = createVideoFrameCaptureSurface(settings.width, settings.height);

        await exportInstance.renderFrameAt(0);
        copyCanvasToCaptureSurface(sourceCanvas, captureSurface);

        const muxer = createMuxerForFormat(format, settings);
        let encoderError = null;

        const ensureEncoderHealthy = () => {
          if (encoderError) throw encoderError;
          if (!encoder || encoder.state !== "configured") {
            throw new Error("Video encoder closed unexpectedly.");
          }
        };

        const flushEncoder = async () => {
          try {
            await encoder.flush();
          } catch (error) {
            throw encoderError || error;
          }
          ensureEncoderHealthy();
        };

        encoder = new VideoEncoder({
          output(chunk, meta) {
            muxer.addVideoChunk(chunk, meta);
          },
          error(error) {
            encoderError = error;
          },
        });

        encoder.configure(encoderConfig);
        ensureEncoderHealthy();

        const totalFrames = Math.max(1, Math.round(settings.duration * settings.fps));
        const frameDurationUs = Math.round(1000000 / settings.fps);
        const keyFrameInterval = Math.max(1, Math.round(settings.fps));
        const flushInterval = (format.codec === "h264" || format.codec === "h265") ? 8 : 16;
        const maxQueueSize = (format.codec === "h264" || format.codec === "h265") ? 2 : 4;

        const codecNote = encoderConfig.codec ? ` (${encoderConfig.codec})` : "";
        setExportStatus(`Offline encoding ${totalFrames} frames in ${modeLabel(exportInstance.mode)} using ${format.label}${codecNote}...`);

        for (let frameIndex = 0; frameIndex < totalFrames; frameIndex += 1) {
          exportState.cancelController.throwIfCancelled();
          ensureEncoderHealthy();

          const timeSeconds = frameIndex / settings.fps;
          const timestampUs = Math.round((frameIndex * 1000000) / settings.fps);

          await exportInstance.renderFrameAt(timeSeconds);
          exportState.cancelController.throwIfCancelled();

          copyCanvasToCaptureSurface(sourceCanvas, captureSurface);

          const frame = new VideoFrame(captureSurface.canvas, {
            timestamp: timestampUs,
            duration: frameDurationUs,
          });

          try {
            ensureEncoderHealthy();
            encoder.encode(frame, {
              keyFrame: frameIndex === 0 || frameIndex % keyFrameInterval === 0,
            });
          } catch (error) {
            throw encoderError || error;
          } finally {
            frame.close();
          }

          ensureEncoderHealthy();

          if (encoder.encodeQueueSize > maxQueueSize || (frameIndex + 1) % flushInterval === 0) {
            await flushEncoder();
          }

          if (frameIndex % 4 === 0) {
            await yieldToMainThread(exportState.cancelController);
            ensureEncoderHealthy();
          }

          setExportProgress(((frameIndex + 1) / totalFrames) * 100);
          setExportStatus(`Encoding frame ${frameIndex + 1} / ${totalFrames}...`);
        }

        await flushEncoder();

        const buffer = muxer.finalize();
        const blob = new Blob([buffer], { type: outputMimeType });
        const url = URL.createObjectURL(blob);
        exportState.previewUrl = url;

        sourceCanvas.classList.add("hidden");

        downloadExportLink.href = url;
        downloadExportLink.download = `perlin-${settings.width}x${settings.height}-${settings.fps}fps.${format.container}`;
        downloadExportLink.classList.remove("hidden");

        exportVideoPreview.src = url;
        exportVideoPreview.classList.remove("hidden");
        exportVideoPreview.play().catch(() => {});

        const canPlay = !!exportVideoPreview.canPlayType(outputMimeType);
        exportResultInfoEl.textContent =
          `Generated ${format.container.toUpperCase()} / ${format.label} - ${outputMimeType} - ${formatBytes(blob.size)}${canPlay ? "" : " - this browser may not preview this file even though it encoded it"}`;

        setExportStatus("Export finished.");
        setExportProgress(100);
      } catch (error) {
        if (isCancelError(error) || exportState.cancelRequested) {
          setExportStatus("Export cancelled.");
          setExportProgress(0);
        } else {
          const message = error && error.message ? error.message : String(error);
          setExportStatus(message, true);
        }
      } finally {
        if (encoder) {
          try { encoder.close(); } catch (e) {}
        }

        cleanupExportRuntime();

        exportState.busy = false;
        exportState.cancelRequested = false;
        syncExportButtons();
        instance.play();
      }
    }

    openExportBtn.addEventListener("click", showExportOverlay);
    closeExportBtn.addEventListener("click", hideExportOverlay);

    exportOverlay.addEventListener("click", (event) => {
      if (event.target === exportOverlay) hideExportOverlay();
    });

    cancelExportBtn.addEventListener("click", () => {
      if (!exportState.busy) return;
      exportState.cancelRequested = true;
      setExportStatus("Cancel requested...");
      if (exportState.cancelController) exportState.cancelController.cancel();
    });

    startExportBtn.addEventListener("click", () => {
      generateExportVideo();
    });

    expContainerEl.addEventListener("change", refreshCodecOptions);
    expCodecEl.addEventListener("change", refreshEncodingInfo);

    for (const el of [
      exportInputs.fps,
      exportInputs.duration,
      exportInputs.width,
      exportInputs.height,
      exportInputs.forceMode,
      exportInputs.color,
      exportInputs.opacity,
      exportInputs.backgroundColor,
      exportInputs.backgroundOpacity,
      exportInputs.scale,
      exportInputs.x,
      exportInputs.y,
      exportInputs.caContrast,
      exportInputs.caSamples,
      exportInputs.caSpread,
      exportInputs.caCenterX,
      exportInputs.caCenterY,
    ]) {
      el.addEventListener("input", refreshEncodingInfo);
      el.addEventListener("change", refreshEncodingInfo);
    }

    window.addEventListener("beforeunload", () => {
      revokePreviewUrl();
      cleanupExportRuntime();
    });

    initializeExportSupport();
  </script>
</body>
</html>
